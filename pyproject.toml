[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gabeo-denial-ai"
version = "0.1.0"
description = "AI-powered claim denial analysis for healthcare RCM (EDI 835/837)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charan" }]
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40,<3",
    "tenacity>=8.4,<10",
    "python-dateutil>=2.9,<3",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.36,<2",
    "plotly>=5.22,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
]

[project.scripts]
gabeo = "gabeo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gabeo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
